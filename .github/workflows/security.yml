name: Security Scan

# IaC misconfig + secret scanning (Trivy) for Helm charts and ArgoCD
# manifests. Posture: REPORT-ONLY — uploads to the Security tab, never
# fails a PR. Tighten with exit-code: "1" once .trivyignore.yaml is tuned.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly drift scan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy (K8s misconfig / secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Token isn't needed after checkout — Trivy scans rendered local files
          # and no later step pushes/fetches (the SARIF upload uses the
          # security-events GITHUB_TOKEN, not the persisted git credential).
          # Dropping it shrinks the blast radius if a downstream action is ever
          # compromised. Matches the infra repo's security.yml.
          persist-credentials: false

      # Render each chart with its env values so the scan sees what ArgoCD
      # actually applies (prod/test replica counts, resources, ingress),
      # not just chart defaults. Plain argocd/*.yaml are scanned as-is by
      # the config step below.
      - name: Render Helm charts
        run: |
          set -euo pipefail
          mkdir -p rendered
          for chart in backend frontend; do
            for env in prod test; do
              helm template "$chart" "charts/$chart" \
                -f "charts/$chart/values-$env.yaml" \
                > "rendered/$chart-$env.yaml"
            done
          done

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config          # K8s/Helm/manifest misconfig mode
          scanners: misconfig,secret
          format: sarif
          output: trivy.sarif
          exit-code: "0"              # report-only
        env:
          TRIVY_DB_REPOSITORY: mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db
          # Path-scoped acceptances. The structured .yaml ignore file is NOT
          # auto-discovered (unlike the legacy .trivyignore) — it must be
          # named explicitly, which this env var does.
          TRIVY_IGNOREFILE: .trivyignore.yaml

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif
          category: trivy
